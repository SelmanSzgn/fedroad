[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedroad"
version = "0.2.0"
description = "Vehicular federated learning simulator"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "pydantic>=2",
    "typer",
    "mlflow",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "httpx", "onnx"]
dvc = ["dvc"]
campaign = ["prefect"]
serve = [
    "fastapi", "uvicorn", "onnxruntime", "pillow", "python-multipart",
]

[project.scripts]
fedroad = "fedroad.cli:app"
fedroad-campaign = "fedroad.campaign:cli"
fedroad-register = "fedroad.registry:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]
