[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedroad"
version = "0.2.0"
description = "Vehicular federated learning simulator"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "pydantic>=2",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fedroad = "fedroad.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
