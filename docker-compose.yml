services:
  mlflow:
    build: .
    image: fedroad
    entrypoint: ["mlflow", "server"]
    command:
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000
    user: root
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 20

  fedroad:
    build: .
    image: fedroad
    profiles: ["run"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HOME: /tmp
    volumes:
      - ./runs:/work/runs
      - ./data:/work/data
      - ./configs:/work/configs

  api:
    build: .
    image: fedroad
    profiles: ["serve"]
    entrypoint:
      - uvicorn
      - fedroad.api:app
      - --host=0.0.0.0
      - --port=8000
    environment:
      MODEL_PATH: /models/model.pt
      HOME: /tmp
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
volumes:
  mlflow-data:
