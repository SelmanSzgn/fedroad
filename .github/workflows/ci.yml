name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU)
        run: >
          pip install torch torchvision
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: pip install -e ".[dev,campaign,serve]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: python -m pytest --cov=fedroad --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fedroad .

      - name: Smoke test
        run: docker run --rm fedroad --help

      - name: API import smoke test
        run: >
          docker run --rm --entrypoint python fedroad
          -c "import fedroad.api"
